# DRAFT: leave both confirmations false until measured wheel/lidar/stop tests pass.
# CFG/ACK uses a fresh session on every connection; all units SI except ticks/s.
motor_bridge:
  ros__parameters:
    # 2026-10-12: Nav2(cwu_nav nav2.launch drive:=true)가 아래 한계를 읽습니다. 구동은
    # ROBOT40_V3 + encoder_odom([V] 바퀴 PI)이 맡고 motor_bridge는 쓰지 않습니다.
    calibration_confirmed: true
    mount_calibration_confirmed: true # mount.yaml yaw 176.4° 스캔 정합 실측
    port: /dev/ttyAMA0
    baud: 115200
    wheel_radius: 0.04151 # effective, floor 1 m test 2026-09-30 (see encoder.yaml)
    wheel_separation: 0.20686
    ticks_per_rev: 3009.5 # provisional mean; repeat 10-turn measurement
    left_sign: 1.0
    right_sign: 1.0
    max_wheel_speed: 0.156 # encoder.yaml max_wheel_tps 900 x 0.1733 mm/틱
    kp_left: -1.0
    ki_left: -1.0
    kp_right: -1.0
    ki_right: -1.0
    pwm_limit: -1
    max_accel_ticks: -1.0
    robot_radius: 0.165 # 원형 지름 330 mm (2026-10-11 사용자)
    braking_distance: 0.04 # 0.1 m/s에서 정지 명령 후 2.0/1.8 cm (전진/후진), 0.22 s. 최대속도 여유
    safety_margin: 0.05
    safety_latency: 0.3 # 스캔 주기 0.1 + 스캔 도착 지연 0.12 + 명령 경로 ~0.05 (collision monitor는 스캔으로 정지)
    max_linear_speed: 0.10
    max_angular_speed: 0.5 # 바퀴 ±0.05 m/s (≈290 틱/s): 바닥에서 멈추지 않는 하한 위
    max_linear_accel: 0.3
    max_angular_accel: 1.5
    mcu_timeout_ms: 300
    command_timeout: 0.2
    scan_timeout: 0.3
    encoder_timeout: 0.3
    tf_timeout: 0.5
    tf_future_tolerance: 0.2
    odom_frame: odom
    base_frame: base_link
    map_frame: map
    publish_tf: true
    pose_covariance: [0.01, 0.01, 0.05]
    twist_covariance: [0.01, 0.01, 0.05]
