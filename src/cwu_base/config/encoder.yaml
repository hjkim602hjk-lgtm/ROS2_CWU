# Nucleo 엔코더 오도메트리 노드의 통신 형식과 바퀴 제원을 설정합니다.
# 여기 값이 틀리면 SLAM이 조용히 어긋난 지도를 만들므로 반드시 실측값을 넣습니다.
# -1은 "아직 측정하지 않음"이라는 뜻이고, 그대로 두면 노드가 실행을 거부합니다.

# 채우는 순서:
#  1) python3 tools/sniff_encoder_serial.py  → port, baud, left_field, right_field
#     단조 증가/감소하는 필드가 누적 틱입니다. 왼쪽 바퀴만 앞으로 굴려서
#     어느 필드가 움직이는지 보면 좌우를 가릅니다. 앞으로 굴릴 때 값이 줄어들면
#     그 쪽 *_sign을 -1.0으로 바꿉니다.
#  2) 바퀴 지름을 자로 재서 반지름(m)을. 좌우 바퀴 접지점 사이 거리를 트레드(m)로.
#  3) ticks_per_rev = 엔코더 CPR x 체배(보통 4) x 감속비. 확실하지 않으면
#     바퀴를 손으로 정확히 10바퀴 굴리며 틱 변화를 읽어 10으로 나눕니다.
#  4) 검증: 1 m 직진 후 ros2 topic echo /odom --once 의 x가 1.0에 가까운지,
#     제자리 360도 회전 후 yaw가 제자리로 돌아오는지 봅니다. 직진 오차는
#     wheel_radius, 회전 오차는 wheel_separation으로 보정합니다.

encoder_odom:
  ros__parameters:
    port: /dev/ttyACM0
    baud: 115200

    # 줄에서 정규식으로 뽑은 정수 필드의 0부터 세는 번호입니다.
    # 예) "12345,-678\n" 이면 left_field: 0, right_field: 1.
    left_field: -1
    right_field: -1
    left_sign: 1.0
    right_sign: 1.0
    # 누적 카운터의 비트 폭. 되감김 보정에 씁니다. 0이면 되감김 없음으로 봅니다.
    counter_bits: 32

    wheel_radius: -1.0        # m, 바퀴 반지름
    wheel_separation: -1.0    # m, 좌우 바퀴 간격(트레드)
    ticks_per_rev: -1.0       # 바퀴 1회전당 틱 수 (감속비 반영 후)

    # 이 시간(초) 동안 틱이 없으면 통신 끊김으로 보고 오류 로그를 남깁니다.
    timeout: 0.5
    odom_frame: odom
    base_frame: base_link
    # robot_localization 등 다른 노드가 odom -> base_link를 발행하면 false로 둡니다.
    publish_tf: true
    # x, y, yaw 분산. 슬립이 심하면 키웁니다.
    pose_covariance: [0.01, 0.01, 0.05]
    twist_covariance: [0.01, 0.01, 0.05]
