# Nucleo 엔코더 오도메트리 노드의 통신 형식과 바퀴 제원을 설정합니다.
# 여기 값이 틀리면 SLAM이 조용히 어긋난 지도를 만들므로 반드시 실측값을 넣습니다.
# -1은 "아직 측정하지 않음"이라는 뜻이고, 그대로 두면 노드가 실행을 거부합니다.

# 채우는 순서:
#  1) python3 tools/sniff_encoder_serial.py  → port, baud, left_field, right_field
#     단조 증가/감소하는 필드가 누적 틱입니다. 왼쪽 바퀴만 앞으로 굴려서
#     어느 필드가 움직이는지 보면 좌우를 가릅니다. 앞으로 굴릴 때 값이 줄어들면
#     그 쪽 *_sign을 -1.0으로 바꿉니다.
#  2) counts_per_mm: 직진 거리(mm)당 틱. wheel_separation: 제자리 회전으로 맞춘 유효 윤거(m).
#  3) 검증: 1 m 직진 후 ros2 topic echo /odom --once 의 x가 1.0에 가까운지,
#     제자리 360도 회전 후 yaw가 제자리로 돌아오는지 봅니다. 직진 오차는
#     counts_per_mm, 회전 오차는 wheel_separation으로 보정합니다.

# 2026-10-14부터 보드 펌웨어는 RobotIntegrated.ino (BASE_NAV_V1, 규약 README_STM_PI_INTERFACE.md).
# 노드가 [N1]을 보내 받는 20 Hz CSV: ms,mode,L,R,PWM_L,PWM_R,PSD_FRONT,PSD_REAR,PSD_LEFT,PSD_RIGHT,SERVO_L,SERVO_R

encoder_odom:
  ros__parameters:
    port: /dev/ttyAMA0
    baud: 115200

    # 줄에서 정규식으로 뽑은 정수 필드의 0부터 세는 번호입니다.
    # 예) "ENC,1499,1406" 이면 left_field: 0, right_field: 1.
    left_field: 2
    right_field: 3
    # BASE_NAV_V1: 앞으로 가면 좌우 틱이 모두 늘어납니다 (V3 대비 펌웨어 ENCODER_SIGN 둘 다 반전,
    # README 6절). V3는 둘 다 줄었음(-1.0).
    left_sign: 1.0
    right_sign: 1.0
    # 누적 카운터의 비트 폭. 되감김 보정에 씁니다. 0이면 되감김 없음으로 봅니다.
    counter_bits: 32

    # 팀 실측 펌웨어 보정값 그대로 (README_STM_PI_INTERFACE.md 7절, 보드 h 응답 # CAL / # TRACK_MM).
    # 400·1000 mm 직진과 제자리 회전으로 보정. 이전 스캔 정합값(반지름·배율·회전 방향별 간격)은 커밋 5abb92c.
    counts_per_mm_left: 5.992624  # (5687/1460) x (40/26)
    counts_per_mm_right: 5.900948 # (5600/1460) x (40/26)
    wheel_separation: 0.1904      # m, 유효 윤거 (물리 206 mm)

    # 이 시간(초) 동안 틱이 없으면 통신 끊김으로 보고 오류 로그를 남깁니다.
    timeout: 0.5
    # 바퀴 속도 상한(m/s). 이보다 빠른 틱 증분은 모터 잡음으로 깨진 줄로 보고 버립니다.
    # 실측 PWM 100에서 약 0.14 m/s입니다. 255면 비례로 약 0.36 m/s라 여유를 두었습니다.
    max_wheel_speed: 0.5
    odom_frame: odom
    base_frame: base_link
    # robot_localization 등 다른 노드가 odom -> base_link를 발행하면 false로 둡니다.
    publish_tf: true
    # x, y, yaw 분산. 슬립이 심하면 키웁니다.
    pose_covariance: [0.01, 0.01, 0.05]
    twist_covariance: [0.01, 0.01, 0.05]

    # BASE_NAV_V1 주행 (launch drive:=true 일 때만). /cmd_vel -> [V mm/s,rad/s] 20 Hz,
    # 바퀴 속도 PI는 펌웨어 안(튜닝 전 초기값). 시작 때 [ARM] 한 번, ABORT 뒤에는
    # ros2 service call /encoder_odom/arm std_srvs/srv/Trigger 로만 다시 무장합니다.
    cmd_timeout: 0.25 # s, 이보다 오래된 /cmd_vel은 정지로 봅니다 (README 5절 250 ms).
