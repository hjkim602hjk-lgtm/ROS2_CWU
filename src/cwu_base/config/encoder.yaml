# Nucleo 엔코더 오도메트리 노드의 통신 형식과 바퀴 제원을 설정합니다.
# 여기 값이 틀리면 SLAM이 조용히 어긋난 지도를 만들므로 반드시 실측값을 넣습니다.
# -1은 "아직 측정하지 않음"이라는 뜻이고, 그대로 두면 노드가 실행을 거부합니다.

# 채우는 순서:
#  1) python3 tools/sniff_encoder_serial.py  → port, baud, left_field, right_field
#     단조 증가/감소하는 필드가 누적 틱입니다. 왼쪽 바퀴만 앞으로 굴려서
#     어느 필드가 움직이는지 보면 좌우를 가릅니다. 앞으로 굴릴 때 값이 줄어들면
#     그 쪽 *_sign을 -1.0으로 바꿉니다.
#  2) counts_per_mm: 직진 거리(mm)당 틱. wheel_separation: 제자리 회전으로 맞춘 유효 윤거(m).
#  3) 검증: 1 m 직진 후 ros2 topic echo /odom --once 의 x가 1.0에 가까운지,
#     제자리 360도 회전 후 yaw가 제자리로 돌아오는지 봅니다. 직진 오차는
#     counts_per_mm, 회전 오차는 wheel_separation으로 보정합니다.

# 2026-10-29부터 보드 펌웨어는 새 RobotIntegrated.ino + MotorControl.h (규약 README_STM_PI_INTERFACE.md).
# 노드가 't'로 켜는 20 Hz CSV: ms,mode,L,R,PWM_L,PWM_R,PSD_FRONT,PSD_REAR,PSD_LEFT,PSD_RIGHT,SERVO_L,SERVO_R
# L·R은 X4 카운트 ÷ 4 (예전 A상 상승 단위 유지). 이동 명령은 /base/command → [F400]·[TL90] 등.

encoder_odom:
  ros__parameters:
    port: /dev/ttyAMA0
    baud: 115200

    # 줄에서 정규식으로 뽑은 정수 필드의 0부터 세는 번호입니다.
    # 예) "ENC,1499,1406" 이면 left_field: 0, right_field: 1.
    left_field: 2
    right_field: 3
    # 앞으로 가면 좌우 틱이 모두 늘어납니다 (펌웨어 LEFT/RIGHT_ENCODER_SIGN이 맞춰 줌).
    left_sign: 1.0
    right_sign: 1.0
    # 누적 카운터의 비트 폭. 되감김 보정에 씁니다. 0이면 되감김 없음으로 봅니다.
    counter_bits: 32

    # 팀 실측 펌웨어 보정값 그대로 (펌웨어 countsPerMmL/R, TRACK_MM, 보드 s 응답 # CAL).
    # 2026-10-29판: X4 디코딩 기준 700 mm 명령에 770 mm → ×740/770, 90° 회전 4번이 340° → 윤거 190.4×360/340.
    # 이전 판 값(5.992624/5.900948, 0.1904)은 A상 상승만 세던 펌웨어 기준이라 쓰지 않음 (커밋 a3ddbd4).
    counts_per_mm_left: 5.759   # (5687/1460) x (40/26) x 740/770
    counts_per_mm_right: 5.671  # (5600/1460) x (40/26) x 740/770
    wheel_separation: 0.2016    # m, 유효 윤거 (물리 206 mm, 미끄럼 포함)

    # 이 시간(초) 동안 CSV가 없으면 통신 끊김으로 보고 q로 세우고 오류 로그를 남깁니다 (텔레메트리 0.05 s 주기).
    timeout: 0.5
    # 바퀴 속도 상한(m/s). 이보다 빠른 틱 증분은 모터 잡음으로 깨진 줄로 보고 버립니다.
    # 펌웨어 최고 CRUISE_RPM 50 ≈ 0.23 m/s (바퀴 한 바퀴 약 278 mm)에 여유를 둠.
    max_wheel_speed: 0.35
    odom_frame: odom
    base_frame: base_link
    # robot_localization 등 다른 노드가 odom -> base_link를 발행하면 false로 둡니다.
    publish_tf: true
    # x, y, yaw 분산. 슬립이 심하면 키웁니다.
    pose_covariance: [0.01, 0.01, 0.05]
    twist_covariance: [0.01, 0.01, 0.05]
