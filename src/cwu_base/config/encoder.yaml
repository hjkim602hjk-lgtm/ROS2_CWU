# Nucleo 엔코더 오도메트리 노드의 통신 형식과 바퀴 제원을 설정합니다.
# 여기 값이 틀리면 SLAM이 조용히 어긋난 지도를 만들므로 반드시 실측값을 넣습니다.
# -1은 "아직 측정하지 않음"이라는 뜻이고, 그대로 두면 노드가 실행을 거부합니다.

# 채우는 순서:
#  1) python3 tools/sniff_encoder_serial.py  → port, baud, left_field, right_field
#     단조 증가/감소하는 필드가 누적 틱입니다. 왼쪽 바퀴만 앞으로 굴려서
#     어느 필드가 움직이는지 보면 좌우를 가릅니다. 앞으로 굴릴 때 값이 줄어들면
#     그 쪽 *_sign을 -1.0으로 바꿉니다.
#  2) 바퀴 지름을 자로 재서 반지름(m)을. 좌우 바퀴 접지점 사이 거리를 트레드(m)로.
#  3) ticks_per_rev = 엔코더 CPR x 체배(보통 4) x 감속비. 확실하지 않으면
#     바퀴를 손으로 정확히 10바퀴 굴리며 틱 변화를 읽어 10으로 나눕니다.
#  4) 검증: 1 m 직진 후 ros2 topic echo /odom --once 의 x가 1.0에 가까운지,
#     제자리 360도 회전 후 yaw가 제자리로 돌아오는지 봅니다. 직진 오차는
#     wheel_radius, 회전 오차는 wheel_separation으로 보정합니다.

# 아래 값의 출처: 2026-09-29 팀 실측 (원격 커밋 44f761e, changwon_robot_2026-09-29.zip).
# 펌웨어는 100 ms마다 "ENC,<left>,<right>"를 보냅니다(STM32 long = 32비트).

encoder_odom:
  ros__parameters:
    port: /dev/ttyAMA0
    baud: 115200

    # 줄에서 정규식으로 뽑은 정수 필드의 0부터 세는 번호입니다.
    # 예) "ENC,1499,1406" 이면 left_field: 0, right_field: 1.
    left_field: 0
    right_field: 1
    # 펌웨어 FLIP_L 적용 후 전진 시 좌우 모두 증가함을 확인했습니다.
    left_sign: 1.0
    right_sign: 1.0
    # 누적 카운터의 비트 폭. 되감김 보정에 씁니다. 0이면 되감김 없음으로 봅니다.
    counter_bits: 32

    # m, 바퀴 반지름. 자로 잰 지름 85.30 mm(0.04265)는 바닥 1 m 직진에서 2.75% 길게 나와
    # 2026-09-30 실측(엔코더 11308.5틱 = 실제 0.98 m)으로 보정한 유효 반지름입니다.
    wheel_radius: 0.04151
    wheel_separation: 0.20686 # m, 좌우 바퀴 간격(트레드) 206.86 mm 실측
    # 바퀴 1회전당 틱 수 (감속비 반영 후). 실측 L 3004, R 3015의 평균입니다.
    # 같은 모터라 차이(0.4%)는 손으로 1회전 맞춘 오차로 봅니다. 직진 시험에서
    # /odom이 한쪽으로 휘면 그때 좌우 개별 값을 둡니다.
    ticks_per_rev: 3009.5

    # 이 시간(초) 동안 틱이 없으면 통신 끊김으로 보고 오류 로그를 남깁니다.
    timeout: 0.5
    # 바퀴 속도 상한(m/s). 이보다 빠른 틱 증분은 모터 잡음으로 깨진 줄로 보고 버립니다.
    # 실측 PWM 100에서 약 0.14 m/s입니다. 255면 비례로 약 0.36 m/s라 여유를 두었습니다.
    max_wheel_speed: 0.5
    odom_frame: odom
    base_frame: base_link
    # robot_localization 등 다른 노드가 odom -> base_link를 발행하면 false로 둡니다.
    publish_tf: true
    # x, y, yaw 분산. 슬립이 심하면 키웁니다.
    pose_covariance: [0.01, 0.01, 0.05]
    twist_covariance: [0.01, 0.01, 0.05]
