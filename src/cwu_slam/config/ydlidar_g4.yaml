# 제조사 ROS 2 드라이버에 전달할 YDLIDAR G4 통신·스캔 설정입니다.
# 직렬 포트, baudrate, 스캔 주파수, 각도·거리 범위와 센서 좌표계 이름을 지정합니다.
# 실물에서 포트와 스캔 방향을 확인해야 하며 출력 데이터는 /scan으로 전달됩니다.
#
# 무효 측정은 inf가 아니라 0.0으로 옵니다. 드라이버가 ranges를 0으로 초기화한 뒤
# range >= range_min인 점만 덮어쓰기 때문입니다(ydlidar_ros2_driver_node.cpp:238-249).
# 제조사 예제의 invalid_range_is_inf는 그 파일 158-160행에서 읽기만 하고 사용되지
# 않는 죽은 파라미터라 여기서 뺐습니다. 소비자가 range_min~range_max 밖 값을 버려야 합니다.

# Based on the vendor's humble/params/G4.yaml; confirm settings on your unit.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    isSingleChannel: false
    intensity: false
    intensity_bit: 0
    sample_rate: 9
    abnormal_check_count: 4
    # 반드시 true로 둡니다. false로 두면 SDK가 all_node_count를 스캔별 실측 점 수로
    # 잡고 angle_increment = 360/(점수-1)을 매번 다시 계산해(CYdLidar.cpp:625-635)
    # LaserScan 배열 크기가 메시지마다 달라집니다. slam_toolbox는 첫 스캔과 점 수가
    # 다른 스캔을 거부하므로 SLAM이 조용히 멈춥니다.
    # 대가로 "Real points 931 > fixed points 930" 경고가 매 스캔 나오고 스윕 끝
    # 1~5점이 버려집니다. 이 경고는 정상이며 끄려 하지 마십시오.
    fixed_resolution: true
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.12
    frequency: 10.0
    debug: false
