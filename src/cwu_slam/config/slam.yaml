# SLAM Toolbox의 지도 생성과 위치 추정 동작을 설정합니다.
# /scan과 odom → base_link TF를 사용하며, 지도 해상도·갱신 주기·scan matching·loop closure를 조정합니다.
# resolution: 0.05는 지도 한 칸이 5cm × 5cm라는 뜻입니다.

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 12.0
    throttle_scans: 1
    minimum_time_interval: 0.2
    # 2026-10-11 녹화 재생 비교(tools/slam_replay.py + slam_eval.py, 109쌍): 0.05 m마다 정합하면
    # 작은 편향이 쌓여 직진을 ~55%로 깎음(위치오차 5.8 cm/구간). 0.25 m + 아래 페널티 → 1.5 cm.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.2
    transform_publish_period: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    map_update_interval: 2.0
    stack_size_to_use: 40000000
    use_map_saver: true
    enable_interactive_mode: false
    debug_logging: false
    use_scan_matching: true
    # 정합이 odom에서 멀리 벗어나지 못하게 좁힙니다(작을수록 odom 신뢰). 보정된 바퀴 odom은
    # 25 cm 구간마다 1.1 cm / 0.8° 오차라 스캔보다 국소적으로 정확합니다. 0.03/0.1과 위
    # 0.25 m 간격 조합이 국소 오차(1.5 cm/1.12°)와 지도 벽 두께(막힌 칸 최소) 모두 최선.
    # 0.05 m 간격과 함께 쓰면 오히려 나빠짐(3.6 cm/4.1°). 기본값 0.5/1.0은 6.0 cm.
    distance_variance_penalty: 0.03
    minimum_distance_penalty: 0.05
    # 각도는 기본값(angle_variance_penalty 1.0, minimum_angle_penalty 0.9): 스캔이 방향을 바로잡게 둠.
    # odom 회전 배율이 회전 방향마다 ~3% 달라(반시계 0.995, 시계 0.967) 각도까지 odom을 강하게
    # 믿으면(0.1/0.3) 복귀 중 방향 오차가 쌓임. 3회차 녹화 재생: 최종 오차 14.4 cm/-9.7° -> 6.2 cm/-1.5°.
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
