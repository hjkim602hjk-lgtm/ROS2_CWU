# 빨간 목표물 검출기의 임계값입니다. 전부 조명·카메라 설정에 따라 달라지므로
# 경기장과 비슷한 조명에서 실측해 확정하고, 경기장 공개 후에는 고치지 않습니다.
#
# 경기장은 회색 RGB(127,127,127), 목표물은 무광 빨강 RGB(255,0,0)입니다.
# 회색은 채도가 0에 가까우므로 채도(S) 하한만으로도 배경과 갈립니다.
# 빨강은 HSV 색상환의 0에서 감기기 때문에 구간이 둘로 나뉩니다.
#
# 이 노드는 방향만 냅니다. 거리 임계값이 여기 없는 이유는 깊이를 쓰지 않기 때문이며,
# 목표물까지의 근접 판단은 그리퍼 PSD가 맡습니다.

target_detector:
  ros__parameters:
    color_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    # geometry_msgs/PointStamped. 컬러 광학 프레임의 단위 방향 벡터입니다.
    bearing_topic: /target/bearing

    # OpenCV HSV: H는 0~179, S·V는 0~255입니다.
    hue_low_1: [0, 120, 60]
    hue_high_1: [10, 255, 255]
    hue_low_2: [170, 120, 60]
    hue_high_2: [179, 255, 255]

    # 424x240에서 50 mm 큐브는 약 2 m 거리에 한 변 6~7 화소(≈45 px)입니다.
    # min_area_px를 키우면 원거리 검출을 잃고, 줄이면 빨간 노이즈를 줍습니다.
    # 실제 검출 유효 거리를 측정해 미션 접근 거리 임계와 맞춥니다.
    min_area_px: 60
    # 큐브는 어느 각도에서 봐도 대체로 사각형입니다. 길쭉하면 반사·잡동사니입니다.
    max_aspect: 2.0
    # 외접 사각형 대비 채움 비율. 볼록한 큐브는 0.5보다 훨씬 큽니다.
    min_fill: 0.5
