# 시각 서보(target_follower)의 제어 상수입니다. 전부 실물 주행으로 재야 하는 값이고,
# 지금 값은 "다치지 않을 만큼 느리게"를 기준으로 고른 초기값입니다.
#
# 이 노드는 거리를 모릅니다. 전진을 멈추는 것은 그리퍼 PSD와 미션 상태머신이며,
# 여기서는 "정렬됐으면 천천히 앞으로"까지만 합니다.

target_follower:
  ros__parameters:
    bearing_topic: /target/bearing
    # Nav2의 /cmd_vel과 이 토픽 중 하나를 안전 감시자가 골라 모터로 보냅니다.
    cmd_topic: /cmd_vel_servo

    # 검출 콜백이 아니라 이 주기로 발행합니다. 목표물이 안 보이면 0이 나가야 하므로
    # 표본이 끊긴 것 자체가 정지 명령이 되어야 합니다.
    rate_hz: 20.0
    # 표본이 이보다 오래되면 목표물을 놓친 것으로 보고 0을 냅니다.
    # 카메라가 15 fps이므로 0.5초는 프레임 7~8개분입니다.
    sample_timeout_s: 0.5

    # 비례 제어 이득 [1/s]. 오차 0.5 rad에서 0.6 rad/s가 나옵니다.
    # 키우면 빨리 정렬되고 넘어가며(overshoot), 줄이면 목표물을 따라가지 못합니다.
    k_yaw: 1.2
    # 최대 각속도 [rad/s]. 카메라 시야(D415 컬러 약 69°)를 넘겨 버리면
    # 목표물이 화면 밖으로 나가 제어가 끊깁니다.
    max_yaw: 0.8
    # 정지 마찰을 넘기는 최소 각속도 [rad/s]. 실측 전에는 0(끔)입니다.
    # 작은 오차에서 모터가 울기만 하고 안 돌면 이 값을 올립니다.
    min_yaw: 0.0

    # 이 안에 들어오면 정렬된 것으로 보고 전진합니다 [rad]. 0.09 rad ≈ 5°.
    # 424x240·초점거리 약 305 px 기준으로 화면 중심에서 약 27 화소입니다.
    align_tol_rad: 0.09
    # 정렬 상태에서의 전진 속도 [m/s]. Nav2의 0.26보다 훨씬 느립니다.
    # 멈추라는 신호가 PSD 하나뿐이므로 그 반응 시간 안에 설 수 있어야 합니다.
    approach_speed: 0.08
