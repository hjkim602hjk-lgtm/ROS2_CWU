# 미션 1 상태머신(cwu_nav/mission1.py) 설정입니다. 경기장 공개 전에 실측으로 확정하고,
# 공개 후에는 고치지 않습니다(규정 2.3). 두 출발 칸 (1,9)·(9,1)에서 같은 값을 씁니다.
# 2026-10-30 펌웨어 속도 모드: 판단은 회전(T)/칸 중심까지 직진(F) 단위, 실행은 멈추지 않는 /cmd_vel.

mission1:
  ros__parameters:
    bearing_topic: /target/bearing
    rate_hz: 20.0

    # 직진 중 정면 PSD 정지: 보드가 60 ms 유지로 먼저 멈추고(# ABORT PSD_FRONT, 펌웨어 10-16 판정), 이 노드도 텔레메트리(5 Hz)
    # 정면 값이 psd_threshold 이상으로 psd_hold_samples번 연속이면 q (보조). 운반 중에는 [PF0]로 보드도 안 봄
    psd_threshold: 550
    psd_hold_samples: 2
    # 그 정지를 "큐브 때문"(파지)으로 볼 기준 (최근 1 s 정면 최대). 2026-10-14 실측:
    # 집게 열림·앞 빔 ≤185, 큐브 앞 345~520, 잡기 좋은 위치 중앙 514·600.
    grasp_front_min: 300
    # 큐브 바로 앞 (잘 잡던 10-14~16 방식): 중앙에 두고 따라왔고 정면 PSD가 이 값 이상이면 더는 돌지 않고 직진만.
    # 그 사이 PSD로 멈추면 화면에 안 보여도 파지
    near_front_min: 250
    # 그 PSD 값이 큐브인지 벽인지: 카메라가 최근 중앙에 봤거나, 라이다가 정면(±8 cm) 이 거리 안에서 아무것도 못 볼 때만
    # 큐브 (큐브는 라이다보다 낮아 안 보임). 주머니 벽을 큐브로 보고 F100만 38번 반복했음 (2026-10-31 Gazebo 시드 6)
    near_wall_m: 0.25

    # 탐색: map 원점 = 출발 칸 중심. 앞이 뚫렸으면 직진, 아니면 가장 가까운 미탐색 경계 칸 (힌트 없음, 2026-10-30)
    # 둘러보기(LOOK): 제자리 회전 없이 도착 칸에서 이만큼만 멈춰 카메라를 보고 다음 목표로 (2026-10-30 사용자 요청:
    # 웹캠 화각이 넓어 칸마다 돌며 확인할 필요 없음). 이동 중에도 카메라를 계속 봄
    look_pause_s: 0.3
    # 탐색 완료 = 카메라로 본 칸 (2026-10-30 사용자 우선순위 1). 칸 중심이 화각 ±camera_half_fov_deg, 거리 0.3~camera_range m
    # 안이고 시선이 라이다로 빈 칸만 지나면 "봄". 못 본 칸은 그 칸으로 가지 않고 화각에 들어오는 자리로 가서 돌아봄.
    # 값은 사용자 지정 (2026-10-30, 웹캠 실측 화각 약 71°)
    camera_half_fov_deg: 35.0      # 화각 70° (2026-10-30 사용자 지정)
    camera_range: 1.3              # m (2026-10-30 사용자 지정)
    # 돌아볼 방향 화각 가운데(±look_half_width m)가 지금 라이다로 look_min_free_m 안에서 막혔으면 돌지 않음 (벽만 보임, 실물 2차)
    look_min_free_m: 0.45
    look_half_width: 0.12
    # 격자 보정 (2026-10-31): 멈춰 있을 때 lattice_period_s마다 라이다 벽 점을 400 mm 칸 경계선에 맞춰 odom 위치를 바로잡음.
    # 위치가 10~20 cm·4° 어긋나 빈 칸을 막힘으로 봤음(Gazebo 사용자 맵 4). 한 번에 lattice_gain만큼 반영, 0이면 끔
    # 방향은 멈출 때마다 벽 방향으로 한 번에 맞춤(벽·장애물이 모두 평행·직각, 2026-10-31 사용자 제안): 조금씩 쌓던 방식은 실물 2차에서
    # odom 방향 오차(시계 방향 회전 배율 약 3%)를 못 따라가 -16°에서 막히고 복귀 실패. 위치(칸 경계선)는 lattice_gain만큼씩
    lattice_gain: 0.7
    lattice_period_s: 0.5
    # 실물 시험(2026-10-31): 돌고 난 직후 스캔은 그 전 방향(G4 135 ms + 지연)이라 TL 뒤 -4°·TR 뒤 +4°씩 쌓여 -31°까지
    # 틀어졌음 → odom이 lattice_still_s 넘게 그대로일 때만 보정.
    # 지도도 돈 뒤 map_still_turn_s 동안은 안 쌓음
    lattice_still_s: 0.4         # 스캔이 멈춘 뒤에 찍히려면 G4 한 바퀴 0.135 s + 지연 0.2 s 넘게
    # 마지막 보정 뒤 이만큼 지나고 그 뒤 돈 적이 있으면 LOOK·GOTO·복귀 걸음마다 lattice_still_s 서서 보정 (안 서면 보정할 때가 없음).
    # 4 s → 1 s: 보정 사이 회전 몇 번에 방향 오차가 쌓여 움직인 만큼 위치가 반 칸 넘게 어긋나면 칸 경계선 맞춤이 옆 칸으로
    # 맞췄음 (odom 회전 오차를 넣은 Gazebo: 집 옆 칸에 있다고 알아 복귀 실패)
    lattice_every_s: 1.0
    # 직진 중 방향 보정 (2026-10-31 실물 7차): 실물 odom은 직진 1 m에 4~5°씩 틀어져 (9,6)에서 벽에 닿음. 직진하는 동안
    # drive_fix_period_s마다 벽 방향과의 차이의 drive_fix_gain만큼 방향만 고침. drive_fix_max_deg 넘는 차이는 잘못 읽은 것으로 보고 버림
    drive_fix_period_s: 0.5
    drive_fix_gain: 0.5
    drive_fix_max_deg: 5.0
    drive_fix_shift_m: 0.03      # 직진 중 옆 위치 보정 한 번 상한 (0.5 s마다, 진행 방향과 직각 성분만)
    # 몸 방향과 실제 진행 방향의 차(쏠림, +왼쪽)를 직진 중 옆 보정으로 배움: crab_min_m 갈 때마다 (옆 보정 합 / 거리)의
    # crab_gain만큼 더함, ±crab_max_deg 안. 실물 2 m 직진 시험 5회(2026-10-31)로 옆 밀림 0인 몸 각도 약 1.6~1.9° , 실물 12회차(고정 -1.7°)에도 옆 보정이 늘 +3.6 cm → 3.0°에서 시작. 시뮬(0°)은 직진 1 m 안에 0으로 배워 내려감
    crab_init_deg: 3.0
    crab_gain: 0.3               # 0.5 → 0.3, crab_min_m 0.3 → 0.6: 실물 13회차 0.6~5.3° 출렁임 (옆 보정 ±2 cm 잡음)
    crab_min_m: 0.6
    crab_max_deg: 6.0
    # 상대 로봇 대응 (규정 9.1 두 팀 동시, 13절 탈취 허용)
    hold_lost_psd: 350           # 운반 중 정면 PSD가 이보다 낮게 hold_lost_s 이어지면 놓침 → 집게 열고 다시 찾기. 쥔 값 약 560~680 (9회차). 0이면 끔
    hold_lost_s: 0.5
    dyn_wait_s: 4.0              # 지나온 칸이 정면에서 막히면 상대 로봇으로 보고 이만큼 기다린 뒤 같은 길로 다시 (칸마다 30 s에 한 번)
    block_ttl_s: 30.0            # 라이다·PSD로 막힌 칸을 이만큼 뒤 다시 시도 (거듭 막힌 칸은 3배). 상대가 잠깐 막은 길이 영원히 막히지 않게
    stall_s: 2.0                 # 앞으로 가는데 정면 라이다 거리가 stall_s 동안 stall_m도 안 줄면 끼임 → 그 칸 막힘, 뒤가 비면 조금 후진
    stall_m: 0.03
    heading_jump_deg: 15.0       # 한 번에 이보다 큰 방향 보정은 다음 측정이 같을 때만 받음 (실물 3차: 잘못 읽은 +35°로 위치 상실)
    map_still_turn_s: 0.4
    # 직접 쌓는 지도 (2026-10-31): SLAM 대신 odom + 격자 보정 자세로 라이다를 쌓음 (SLAM이 긴 통로에서 1~2.6 m 튀어
    # 맵 2·3 실패). 회전 중이 아닐 때 map_period_s마다, map_range_m 안의 점만. 지도 크기는 출발 칸 기준 사방 map_size_m/2
    # 경계 잡점 제거 (grid.scan_points): 양옆 빔 둘 다와 이만큼(1 m 넘으면 거리 배) 넘게 다른 외톨이 점은 버림.
    # 물체 가장자리에서 G4가 앞뒤 면 사이 허공에 찍는 점이 가짜 막힘·가짜 벽이 됨 (2026-10-31 사용자 요청). 0이면 끔
    edge_jump_m: 0.05
    # 경기장 한도: 출발 모서리에서 앞·왼쪽으로 이 칸 수 밖은 막힘 (규정 9×9, 작은 연습장은 이 안). 바깥벽 너머 가짜 빈 칸 방지
    arena_cells: 9
    target_hold_s: 8.0           # 큐브 쪽 우회 길이 없을 때 이만큼 큐브를 안 본 것으로 하고 다른 곳으로 (접근 되풀이 방지)
    center_tol_m: 0.07           # 칸 경로 직선에서 이만큼 넘게 옆으로 비키면 먼저 지금 칸 한가운데로 (통로 모서리에 걸림 방지)
    corridor_tol_m: 0.03         # 다음 칸이 한 칸 통로면 라이다로 잰 통로 가운데에서 이만큼 넘게 비키면 먼저 맞춤 (몸 33 cm·통로 40 cm)
    # 길 가운데 지나기 (2026-11-01 사용자: 모든 길은 로봇이 지나가게 되어 있으니 가운데에만 있으면 됨). 직진 중 앞 0.45 m 양옆
    # 벽 사이가 passage_min_m 이상이면 k_center x (가운데까지 옆 거리) rad/s로 조향, 옆 모서리 정지는 막힘으로 안 두고
    # squeeze_back_mm 물러나 다시 (칸마다 두 번)
    passage_min_m: 0.35          # 몸 지름 0.33 + 2 cm
    k_center: 4.0
    squeeze_back_mm: 150
    cube_start_cell: [4, 4]      # 규정 큐브 시작 칸 (5,5) = 출발 (0,0) 기준 앞 4·왼쪽 4. 카메라 방향선이 지나면 큐브 칸으로 먼저 봄
    # 복귀는 왔던 길을 거꾸로, 지도에서 비면 사선 지름길 (grid.trail_route, 2026-10-31 사용자). 지름길은 몸 둘레
    # trail_clearance_m 안이 다 본 빈 화소일 때만 (몸 반지름 0.165). 경유점 trail_arrive_m 안이면 도착 (라이다 도착 기준과 같게)
    trail_clearance_m: 0.17
    trail_arrive_m: 0.15
    trail_short_m: 0.45          # 직진을 보낸 경유점은 이 안에서 라이다가 세워도 닿은 것으로 (꺾이는 칸 앞 모서리)
    trail_turn_deg: 10.0         # 경유점 방향이 이보다 틀어지면 먼저 제자리 회전 (조향으로 비스듬히 가면 옆벽에 걸림)
    trail_diag_clearance_m: 0.22 # 사선 지름길은 이만큼 여유 (몸 0.165 + 집게). 축 방향은 trail_clearance_m
    map_resolution: 0.05
    map_size_m: 16.0
    map_range_m: 4.0
    map_period_s: 0.25
    # 맞은 적 없이 빔이 이만큼 지나가야 빈 바닥 (2026-10-31 실물 8차): 벽이 굳기 전 첫 스캔이 낮은 벽 위로 칠한 경기장 밖을
    # 빈 칸으로 안 침. 벽이 굳은 뒤로는 벽을 지나는 빔을 벽에서 자름 (grid.mark_scan)
    map_min_misses: 2
    mission_map_hz: 3.0          # /mission_map(자체 지도, odom 기준)을 RViz로 내보내는 횟수/s, 0이면 안 냄 (2026-10-31 사용자 지정)

    # 접근 (2026-10-30 사용자 요청: 10 cm씩 끊지 않음): 보이면 그 방향(지도 기준)을 기록하고, 오차가 align_deg 이상이면
    # 그만큼 회전(펌웨어 최소 10°), 아니면 라이다로 비어 있는 만큼 한 번에 직진(최대 approach_max_mm). 정면 PSD로 서면 파지.
    # 그 방향 앞이 막혔으면 격자로 돌아서 그 방향 칸으로
    align_deg: 5.0
    approach_max_mm: 600         # 남는 방향 오차 5°면 600 mm에 옆 52 mm — 그만큼마다 다시 조준
    max_blind_moves: 2           # 큐브가 화면에서 빠진 뒤 기록한 방향으로 계속 가는 횟수
    approach_step_mm: 100        # 회전 중 PSD로 멈췄을 때 짧게 빠져나오는 직진 (펌웨어 최소)
    max_approach_steps: 40
    sample_timeout_s: 0.5
    confirm_count: 3             # 멈춘 뒤 이만큼 검출이 confirm_window_s 안에 와야 목표물로 인정
    confirm_window_s: 1.0
    grasp_target_age_s: 2.0      # PSD 정지 때 이 안에 중앙에 보였어야 파지

    # 파지 (8). 펌웨어 8 = 99/78: 105/75는 잡히지만 오른쪽 서보가 혼자 열렸다 닫혀 3°씩 완화
    # (2026-10-14), 102에서 왼쪽이 또 말썽이라 왼쪽만 3° 더 (2026-10-15). 2026-10-29판 펌웨어에도 같은 값으로 넣음 (사용자 확인)
    grip_angles: [99, 78]
    open_angles: [40, 140]       # 펌웨어 7 = 열기. 이 각도에 도달해야 탐색 시작
    grip_timeout_s: 4.0          # 서보 1도/30 ms, 40→99는 약 1.8 s

    # 격자 이동 (grid.py)
    cell_size: 0.4
    # 칸 중심 조준 오차가 이 이상일 때만 제자리 회전, 그 아래는 직진하며 방향을 고침 (펌웨어 최소 10°). 30°였을 때 틀어진
    # 채 출발해 통로 모서리(앞 22 cm·옆 11 cm)에 바로 걸렸음 (2026-10-31 Gazebo l5 12차: 큐브 옆 칸으로 F998이 세 번 섬)
    turn_min_deg: 12.0
    # 한 번 직진에 최대 칸 수: 앞이 뚫렸으면 쭉 (2026-10-29 사용자 요청). 펌웨어 최대 1000 mm라 2칸(800 mm).
    # 회전 오차 5°면 800 mm에 옆 70 mm로 통로 여유(35 mm)를 넘을 수 있음 → 라이다가 막히면 1칸으로 줄여 감
    max_cells: 2
    body_radius: 0.165           # 몸 반지름 (지름 330 mm): 라이다 정지·통로 검사 띠의 옆 폭, 후진 쪽 끝
    # 앞끝 (2026-10-31 사용자): 집게 때문에 정면·정면 대각선이 몸보다 5 cm 더 나옴. 전진 정지·접근 통로 검사에서 가운데
    # ±front_half_width만 반지름 front_extent 호로 봄. 몸 폭 끝까지 넓혔더니 벽에 붙어 달릴 때 옆벽을 앞 막힘으로 봤음 (실물 11차)
    front_extent: 0.255          # 0.215 → 0.255 (2026-10-31 사용자: 앞쪽 4 cm 더)
    front_half_width: 0.12       # 집게 폭의 반 (실측하면 고칠 것)
    front_extent_holding: 0.28   # 큐브를 쥐었을 때 앞끝: 닫힌 집게가 라이다에 앞 19 cm·옆 11 cm로 잡힘 (실물 12·13차), +4 cm
    # 칸 경로가 열렸는지 볼 때(칸 중심선 기준) 띠 반폭. 장애물은 칸을 통째로 막으므로 막는 면은 ±200 mm 전체에 걸침 →
    # 좁혀도 놓치지 않고, 몸 폭(165)이면 벽과 여유 35 mm라 SLAM 방향 4°에 빈 칸을 막힘으로 봤음 (2026-10-30 Gazebo 시드 7:
    # 149번 중 72번). 실제 부딪힘은 주행 중 몸 폭 라이다 정지·정면 PSD가 막음
    # 0.10 → 0.06 (2026-10-30 에이전트 분석: SLAM 지도가 격자와 10 cm쯤 어긋나면 옆 벽이 띠 안(8~10 cm)에 들어와 빈 통로가
    # 막힘 → 시드 1 복귀 실패·시드 6 복귀 지연). 막는 면은 ±0.2 전체라 0.06으로도 잡힘
    # 0.06 → 0.03 (2026-10-31 실물 5차): 칸을 막는 장애물 면은 경로 한가운데를 가로지름. ±6 cm 띠는 위치가 옆으로 10~14 cm
    # 어긋나면 통로 옆벽 끝(앞 20 cm, 옆 5~6 cm)이 걸려 열린 칸을 막힘으로 봤음 → (7,8) 같은 열린 길에 안 들어감
    path_half_width: 0.03
    # 직진 중 몸 옆 벽이 wall_keep(m)보다 가까우면 k_wall x (왼쪽 여유 - 오른쪽 여유) rad/s를 조향에 더해 벽에서 떨어짐.
    # 몸 반경 165 + 25 mm. 400 mm 통로에서 SLAM이 몇 cm 틀려 벽에 붙어 달리던 것 (2026-10-30 Gazebo)
    wall_keep: 0.175             # 0.19 → 0.175: 몸(반지름 0.165)이 벽 1 cm 안일 때만 밂 (실물 2차 S자, 아래)
    # 3.0은 벽에 3 cm 파고들어도 0.09 rad/s라 목표점 조향(k_heading)에 묻혀 벽에 붙은 채 달렸음 (2026-10-30 Gazebo v9
    # 시드 10·12: 복귀·접근 중 옆 PSD 900으로 라이다 정지 반복) → 12 (3 cm에 0.36 rad/s)
    # 12 → 5, 상한 0.5 → 0.25 (2026-10-31 실물 2차): 실물 라이다 잡음·통로 폭 차이로 양쪽 벽을 번갈아 밀어 직진 한 번에
    # odom 방향이 -18°~+12° 흔들리는 S자로 달렸음. 시뮬레이션 값은 SLAM 위치가 몇 cm 틀리던 때 맞춘 것
    k_wall: 5.0
    max_wall_push: 0.25          # rad/s 상한. 크면 목표에서 0.5 rad 넘게 돌아가 전진 0으로 버팀 (v10 시드 6: 20 s 시간 초과)
    settle_s: 0.0                # 이동이 끝나면 기다리지 않고 바로 다음 이동 (2026-10-30: 멈칫거림 없앰)
    move_timeout_s: 20.0         # 펌웨어 MOTION_TIMEOUT 15 s + 여유. 넘으면 q. 직진은 여기에 거리 / drive_speed를 더함
    max_goal_steps: 30           # 한 목표에 이만큼 움직여도 못 가면 다른 목표
    block_confirm: 3             # 같은 칸이 이만큼 막히면 막힘 표시를 비울 때도 남김 (사용자 맵 2 복귀 220 s 정지, 2026-10-31)
    max_return_retries: 3        # 넘으면 기록을 모두 비우고 처음부터 다시 계획 (멈추지 않음, 2026-10-30)
    # 연속 이동 실행 (펌웨어 [V] 한계 150 mm/s, 1.2 rad/s)
    drive_speed: 0.12            # m/s, 칸 이동·직진
    # 두 칸 넘게(fast_min_m) 가는 직진만 마지막 한 칸 전까지 fast_speed로, 앞이 fast_clear_m 넘게 비었을 때 (2026-10-31 사용자:
    # 펌웨어 PWM 상한 255·속도 상한 없앰, "2칸 이상 갈 때만 속도 올리고"). 실물 0.12 m/s에 PWM 약 110 → 0.22 m/s ≈ 200.
    # 빠를 때는 정지 띠를 scan_latency_s 동안 더 가는 만큼 넓힘
    fast_speed: 0.25            # 0.22 → 0.25 (2026-11-02 사용자. 0.27·0.30은 시뮬에서 빨라지지 않고 복귀 반복이 늘었음)
    fast_min_m: 0.75
    fast_clear_m: 0.6
    scan_latency_s: 0.2
    approach_speed: 0.08         # m/s, 큐브 접근 (PSD 정지 전 제동거리)
    grasp_push_m: 0.025          # 정면 PSD로 선 뒤 이만큼 더 들어가서 집게를 닫음 (0이면 바로 닫음, 1.5 s 넘으면 그 자리에서). 0.015 → 0.025 (2026-11-01 사용자: 정면 임계 600처럼 더 가까이서 잡기, 펌웨어 550은 그대로)
    grasp_push_speed: 0.03       # m/s, 그 더 들어가기 속도 (빠르면 감속 중 미끄러져 큐브를 밂: 0.08이면 3 cm 더 감)
    grasp_psd: 600               # 집게를 닫는 정면 PSD 기준. 보드는 550(펌웨어 PSD_THRESHOLD)에서 서고, 그 뒤 PF0로 천천히 들어가 이 값에서 닫음 (최대 grasp_push_m·1.5 s)
    turn_speed: 0.6              # rad/s, 제자리 회전 (끝 무렵엔 줄임)
    min_turn_speed: 0.4          # 끝 무렵 최저 (바퀴 약 40 mm/s). 0.25면 바퀴가 마찰에 걸려 ENCODER_NO_PULSE (10-30)
    k_heading: 1.5               # 직진 중 목표 지점 방향 오차 → 회전 속도
    max_steer: 1.0               # rad/s
    turn_tol_deg: 4.0
    turn_extra_deg: 1.0          # 회전마다 더 돎: 실물 90° 회전이 평균 0.8° 모자람 (2026-10-31 회전 시험)
    arrive_m: 0.04               # 목표 지점까지 진행 방향 거리가 이 아래면 다음 이동으로
    approach_turn_deg: 25.0      # 접근 중 이보다 크게 벗어났을 때만 제자리 회전
    arm_retry_s: 1.0             # 보드 무장 요청 재시도 간격        # 복귀 경로 없음 → 옆 칸으로 옮겨 다시, 이 횟수 넘으면 종료

    # 이 시간 안에 보드 정지가 이만큼 넘으면 멈춤 (부딪힘 반복 방지)
    max_aborts: 8
    abort_window_s: 60.0
