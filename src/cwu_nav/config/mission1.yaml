# 미션 1 상태머신(cwu_nav/mission1.py) 설정입니다. 경기장 공개 전에 실측으로 확정하고,
# 공개 후에는 고치지 않습니다(규정 2.3). 두 출발 칸 (1,9)·(9,1)에서 같은 값을 씁니다.
# 2026-10-29 펌웨어: 연속 속도 없음. 이동은 [F100~1000] 직진·[TL/TR 10~180] 제자리 회전 하나씩.

mission1:
  ros__parameters:
    bearing_topic: /target/bearing
    rate_hz: 20.0

    # 직진 중 정면 PSD 정지는 이 노드가 함 (2026-10-29 펌웨어는 PSD로 멈추지 않음): 텔레메트리(20 Hz) 정면 값이
    # psd_threshold 이상으로 psd_hold_samples번 연속이면 q. 한 표본은 잡음으로 70~150 튐(2026-10-14). 운반 중에는 안 봄
    psd_threshold: 550
    psd_hold_samples: 2
    # 그 정지를 "큐브 때문"(파지)으로 볼 기준 (최근 1 s 정면 최대). 2026-10-14 실측:
    # 집게 열림·앞 빔 ≤185, 큐브 앞 345~520, 잡기 좋은 위치 중앙 514·600.
    grasp_front_min: 300
    # 접근 마지막: 카메라가 큐브를 놓쳐도 정면 PSD가 이 값 이상이면 F100을 몇 번 더 (max_blind_steps)
    near_front_min: 250

    # 탐색. map 원점 = 출발 칸 중심. (9,1)에서 x축을 등지고 +y로 놓으면(1,9는 점대칭) 중앙 (5,5)는
    # 전방 4칸·좌측 4칸 = (1.6, 1.6) m → 칸 (4, 4). 먼저 그 칸과 옆 칸으로 갑니다.
    search_hint: [1.6, 1.6]
    initial_spin_deg: 90.0       # 출발 직후 첫 둘러보기만 반시계 고정 각도 (2026-10-17)
    look_step_deg: 45            # 둘러보기 한 번 회전. 카메라 ±30°라 15° 겹침
    # 둘러보기는 라이다로 spin_open_dist보다 멀리 트인 방향(spin_min_gap_deg 이상 폭)만 카메라가 지나가게 돎.
    # 벽(200 mm)은 큐브(50 mm)를 가리므로 벽 쪽은 볼 필요 없음 (2026-10-15).
    spin_open_dist: 0.6
    camera_half_fov_deg: 30.0    # 웹캠 수평 화각 ±35°, 좌우 끝에 잘린 덩어리는 버리므로 30°
    spin_min_gap_deg: 5

    # 접근: 방향 오차가 align_deg 이상이면 그만큼 회전(펌웨어 최소 10°), 아니면 approach_step_mm 직진
    align_deg: 5.0
    approach_step_mm: 100        # 펌웨어 최소 직진
    max_blind_steps: 3           # 큐브가 화면 아래로 빠진 뒤 그대로 직진하는 횟수
    max_approach_steps: 40
    sample_timeout_s: 0.5
    confirm_count: 3             # 멈춘 뒤 이만큼 검출이 confirm_window_s 안에 와야 목표물로 인정
    confirm_window_s: 1.0
    grasp_target_age_s: 2.0      # PSD 정지 때 이 안에 중앙에 보였어야 파지

    # 파지 (8). 펌웨어 8 = 99/78: 105/75는 잡히지만 오른쪽 서보가 혼자 열렸다 닫혀 3°씩 완화
    # (2026-10-14), 102에서 왼쪽이 또 말썽이라 왼쪽만 3° 더 (2026-10-15). 2026-10-29판 펌웨어에도 같은 값으로 넣음 (사용자 확인)
    grip_angles: [99, 78]
    open_angles: [40, 140]       # 펌웨어 7 = 열기. 이 각도에 도달해야 탐색 시작
    grip_timeout_s: 4.0          # 서보 1도/30 ms, 40→99는 약 1.8 s

    # 격자 이동 (grid.py)
    cell_size: 0.4
    grid_span: 8                 # 출발 칸에서 ±8칸 (9×9 경기장 어느 모서리에서 출발해도 덮음)
    turn_min_deg: 5.0            # 칸 중심 조준 오차가 이 이상이면 먼저 회전 (펌웨어 최소 10°)
    max_cells: 1                 # 한 번 직진에 최대 칸 수. 회전 오차 5°면 400 mm에 옆 35 mm(통로 여유와 같음)
    body_radius: 0.165           # 직진 전 라이다 통로 검사 폭·몸체 앞끝 (지름 330 mm)
    settle_s: 0.5                # # DONE 뒤 SLAM 자세가 따라올 시간 (map 갱신 1 s)
    move_timeout_s: 20.0         # 펌웨어 MOTION_TIMEOUT 15 s + 여유. 넘으면 q
    max_goal_steps: 30           # 한 목표에 이만큼 움직여도 못 가면 다른 목표
    max_return_retries: 3        # 복귀 경로 없음 → 옆 칸으로 옮겨 다시, 이 횟수 넘으면 종료

    # 이 시간 안에 보드 정지가 이만큼 넘으면 멈춤 (부딪힘 반복 방지)
    max_aborts: 8
    abort_window_s: 60.0
