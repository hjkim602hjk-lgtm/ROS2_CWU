# Nav2 기성 스택의 경로계획·주행·복구 동작을 3.6 m 경기장에 맞춰 설정합니다.
# 사전 지도를 쓰지 않습니다. SLAM Toolbox가 /map과 map → odom TF를 실시간으로 주고,
# 여기서는 map_server·AMCL 없이 그 결과 위에서 경로를 만들고 따라갑니다.
#
# ── 실물 보정 손잡이 (경기장 공개 전에 확정) ────────────────────────────
#  robot_radius        : 그리퍼·PSD·배선을 포함한 실제 최대 확장 반경(m).
#                        규정 4.1의 Ø400 mm 한계 기준 상한이 0.20입니다.
#                        여유 없이 0.20을 쓰면 벽에 붙어 지나가려다 긁습니다.
#  desired_linear_vel  : 실제로 안전하게 멈출 수 있는 속도. 제동거리 실측 후 조정.
#  inflation_radius    : 키우면 안전하지만 400 mm 통로가 막힙니다. 아래 주석 참조.
# 값을 바꾸면 반드시 데모 왕복으로 경로가 여전히 나오는지 확인합니다.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # BT XML과 plugin_lib_names는 Nav2 기본값을 그대로 씁니다.
    # 목록을 직접 적으면 기본값을 통째로 덮어쓰기 때문에, 기본 BT가 쓰는 노드
    # 하나만 빠져도(예: RemovePassedGoals) bt_navigator가 configure에서 죽습니다.
    # 미션 상태머신이 전용 BT를 쓸 때 그때 필요한 것만 추가합니다.

controller_server:
  ros__parameters:
    use_sim_time: false
    # Pi 4 4GB 예산. DWB의 궤적 샘플링은 같은 조건에서 훨씬 비쌉니다.
    # ponytail: RPP는 지역 회피를 컨트롤러가 하지 않고 재계획에 맡깁니다.
    #           미션2에서 상대 로봇 회피가 부족하면 DWB로 교체하고 CPU를 다시 잽니다.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # 50 mm 큐브 접근은 Nav2가 아니라 파지 접근 제어가 맡습니다.
      # 여기 허용오차는 "그 접근을 시작할 수 있는 위치"까지입니다.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.26
      lookahead_dist: 0.40
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      # 충돌 예측 끔: 로봇 외곽 원을 5 cm 칸으로 찍어 검사해 사실상 반경 ~0.185 m가 되므로, 400 mm 통로
      # (지름 300 mm 로봇)에서는 경로가 장애물과 0.169 m 떨어져 있어도 매번 "collision ahead"로 정지했음
      # (2026-10-16 10회차, 40 s에 116회). 충돌 방지는 collision monitor(실제 스캔 점 vs 반경 0.165 원)와 정면 PSD가 맡습니다.
      # Humble RPP는 이 값을 실행 중에 바꿔도 반영하지 않습니다(재시작 필요).
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.10
      # 차동구동이므로 제자리 회전 후 직진이 가장 확실합니다.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      # 후진은 LiDAR 사각(뒤쪽 장착 시)과 그리퍼 충돌 위험이 있어 금지합니다.
      allow_reversing: false
      max_robot_pose_search_dist: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 경기장이 3.6 m라 3 m 창이면 사실상 주변 전부입니다. 더 키울 이유 없음.
      # width/height는 Nav2가 정수(m)로 선언합니다. 2.5 같은 소수를 넣으면
      # controller_server가 타입 오류로 컨테이너에 실리지 않습니다.
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.150
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          sensor_frame: laser_frame
          # G4는 무효 측정을 inf가 아닌 0.0으로 돌려줍니다(README 3장).
          # obstacle_range/raytrace_range 밖과 min_obstacle_height 미만을 버리게 두고,
          # 0.0은 min_range보다 작아 costmap이 알아서 폐기합니다.
          min_obstacle_height: -0.1
          max_obstacle_height: 0.30
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          marking: true
          clearing: true
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 장애물은 400 mm 격자에 정렬되고 간격도 400 mm 배수입니다.
        # 실제 몸체 0.165(지름 330 mm)면 400 mm 통로에서 양옆 여유가 35 mm뿐입니다.
        # 2026-10-15 사용자 결정: robot_radius 0.150, inflation_radius 0.35 → 0.20 → 0.17로 완화
        # (모의 경기장에서 지도상 열린 길을 RPP가 "collision ahead"로 계속 거부).
        inflation_radius: 0.17
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 사전 지도 없음(규정 2.3). 전역 경로는 SLAM이 만든 /map(정적 레이어)만으로 짭니다.
      # 스캔 장애물 레이어는 레이저가 다시 지나가지 않는 칸(벽 뒤·트인 곳)의 표시를 영영 못 지워
      # 유령 장애물이 쌓였음: 2026-10-15 9회차, 실제로 뚫린 통로를 막아 로봇이 0.75 m² 안에 갇힘
      # (SLAM 벽만으로는 61 m², 모든 목표 도달 가능). 실시간 장애물은 로컬 비용지도·collision monitor·PSD가 맡습니다.
      # 10-12 복귀 시험의 "SLAM 벽 흔적이 로봇 위에 남아 출발 칸 lethal"은 footprint_clearing_enabled로 막습니다.
      # 크기·원점은 정적 레이어가 /map에 맞춥니다.
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      # 계획용 반경 (몸체 0.150보다 작게, drive_config.py가 덮어쓰지 않음). 경기장 통로·장애물 간격은 400 mm 이상이라
      # (사용자 확인 2026-10-16) 지도에 보이는 틈은 모두 길입니다. 5 cm 칸에서 벽이 통로 안쪽으로 한 칸씩 찍히면
      # 400 mm 통로가 300 mm로 보여 반경 0.150이면 막힘이 되므로, 지도상 0.2 m 이상 틈은 지나가게 0.075.
      # 닿지 않게 하는 것은 실제 몸체 크기의 collision monitor·로컬 비용지도.
      robot_radius: 0.075
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 사용자 결정 0.17 유지 (2026-10-16, 0.35 제안 반려)
        inflation_radius: 0.17
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      # 다익스트라 (2026-10-16 16회차): A*는 길이 있는데도 같은 지도·자세에서 복귀 계획을 157번 실패, 실행 중
      # false로 바꾸자 즉시 경로가 나와 44 s 만에 복귀. NavFn A*는 이웃 갱신 비교에 거리 추정값을 더하고 목표 칸에
      # 처음 닿으면 멈춰 지도 모양에 따라 실패할 수 있음 (되살린 지도 7종에서는 재현 안 됨, 정확한 실패 지점 미확인).
      use_astar: false
      # 미탐색 영역을 지나는 경로를 허용해야 프론티어 탐색이 가능합니다.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 차동구동: y는 항상 0. 상한은 controller_server와 같은 값을 유지합니다.
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.1
    source_timeout: 0.3
    base_shift_correction: false
    stop_pub_timeout: 0.2
    polygons: [Approach]
    # Synthetic fixture only. Real drive sets radius / time from measured motor.yaml.
    Approach:
      type: circle
      radius: 0.25
      action_type: approach
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 2 # 3번째 점부터 반응 (단일 잡음점 무시)
      visualize: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
