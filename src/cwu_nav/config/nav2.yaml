# Nav2 기성 스택의 경로계획·주행·복구 동작을 3.6 m 경기장에 맞춰 설정합니다.
# 사전 지도를 쓰지 않습니다. SLAM Toolbox가 /map과 map → odom TF를 실시간으로 주고,
# 여기서는 map_server·AMCL 없이 그 결과 위에서 경로를 만들고 따라갑니다.
#
# ── 실물 보정 손잡이 (경기장 공개 전에 확정) ────────────────────────────
#  robot_radius        : 그리퍼·PSD·배선을 포함한 실제 최대 확장 반경(m).
#                        규정 4.1의 Ø400 mm 한계 기준 상한이 0.20입니다.
#                        여유 없이 0.20을 쓰면 벽에 붙어 지나가려다 긁습니다.
#  desired_linear_vel  : 실제로 안전하게 멈출 수 있는 속도. 제동거리 실측 후 조정.
#  inflation_radius    : 키우면 안전하지만 400 mm 통로가 막힙니다. 아래 주석 참조.
# 값을 바꾸면 반드시 데모 왕복으로 경로가 여전히 나오는지 확인합니다.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # BT XML과 plugin_lib_names는 Nav2 기본값을 그대로 씁니다.
    # 목록을 직접 적으면 기본값을 통째로 덮어쓰기 때문에, 기본 BT가 쓰는 노드
    # 하나만 빠져도(예: RemovePassedGoals) bt_navigator가 configure에서 죽습니다.
    # 미션 상태머신이 전용 BT를 쓸 때 그때 필요한 것만 추가합니다.

controller_server:
  ros__parameters:
    use_sim_time: false
    # Pi 4 4GB 예산. DWB의 궤적 샘플링은 같은 조건에서 훨씬 비쌉니다.
    # ponytail: RPP는 지역 회피를 컨트롤러가 하지 않고 재계획에 맡깁니다.
    #           미션2에서 상대 로봇 회피가 부족하면 DWB로 교체하고 CPU를 다시 잽니다.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # 50 mm 큐브 접근은 Nav2가 아니라 파지 접근 제어가 맡습니다.
      # 여기 허용오차는 "그 접근을 시작할 수 있는 위치"까지입니다.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.26
      lookahead_dist: 0.40
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      # 충돌 예측: carrot까지의 경로가 코스트맵과 닿으면 멈춥니다.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.10
      # 차동구동이므로 제자리 회전 후 직진이 가장 확실합니다.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      # 후진은 LiDAR 사각(뒤쪽 장착 시)과 그리퍼 충돌 위험이 있어 금지합니다.
      allow_reversing: false
      max_robot_pose_search_dist: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 경기장이 3.6 m라 3 m 창이면 사실상 주변 전부입니다. 더 키울 이유 없음.
      # width/height는 Nav2가 정수(m)로 선언합니다. 2.5 같은 소수를 넣으면
      # controller_server가 타입 오류로 컨테이너에 실리지 않습니다.
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          sensor_frame: laser_frame
          # G4는 무효 측정을 inf가 아닌 0.0으로 돌려줍니다(README 3장).
          # obstacle_range/raytrace_range 밖과 min_obstacle_height 미만을 버리게 두고,
          # 0.0은 min_range보다 작아 costmap이 알아서 폐기합니다.
          min_obstacle_height: -0.1
          max_obstacle_height: 0.30
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          marking: true
          clearing: true
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 장애물은 400 mm 격자에 정렬되고 간격도 400 mm 배수입니다.
        # robot_radius 0.22면 지름 0.44라 400 mm 통로는 애초에 못 지나갑니다.
        # inflation_radius를 더 키우면 800 mm 통로까지 막히므로 0.35에서 멈춥니다.
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # 사전 지도 없음. 크기·원점은 SLAM Toolbox의 /map을 따라갑니다(규정 2.3).
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.22
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        # SLAM이 지도를 계속 다시 그리므로 매번 받아 덮어씁니다.
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          sensor_frame: laser_frame
          min_obstacle_height: -0.1
          max_obstacle_height: 0.30
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          raytrace_max_range: 4.0
          raytrace_min_range: 0.12
          marking: true
          clearing: true
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: true
      # 미탐색 영역을 지나는 경로를 허용해야 프론티어 탐색이 가능합니다.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 차동구동: y는 항상 0. 상한은 controller_server와 같은 값을 유지합니다.
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

# Synthetic fixture only. Real drive replaces points from measured motor.yaml.
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.1
    source_timeout: 0.3
    base_shift_correction: false
    stop_pub_timeout: 0.2
    polygons: [Stop]
    Stop:
      type: polygon
      points: [0.32, 0.32, 0.32, -0.32, -0.32, -0.32, -0.32, 0.32]
      action_type: stop
      max_points: 0
      visualize: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
