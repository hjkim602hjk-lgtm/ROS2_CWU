; Nucleo-F446RE 모터·엔코더 펌웨어. 원본은 팀 커밋 44f761e(changwon_robot_2026-09-29.zip).
; 빌드: pio run -d firmware/nucleo    업로드: pio run -d firmware/nucleo -t upload
; Arduino IDE를 쓰면 src/changwon_robot_stm.ino를 그대로 열어도 됩니다.
[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
monitor_speed = 115200
; snprintf pulls newlib stdio after libFrameworkArduino; retain its _write shim.
; Serial = UART4 on PC10(TX) / PC11(RX) (CN7 1/2), wired to Pi GPIO15/14 (/dev/ttyAMA0).
; ST-Link USB serial froze under motor noise; USB stays for upload only.
build_flags = -Wl,-u,_write
  -D SERIAL_UART_INSTANCE=4
  -D PIN_SERIAL_RX=PC11
  -D PIN_SERIAL_TX=PC10
